name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install dependencies
        run: bun install --frozen-lockfile 2>&1 | tee /tmp/step-1-install.log

      - name: Typecheck
        run: bunx tsc --noEmit 2>&1 | tee /tmp/step-2-typecheck.log

      - name: Lint
        run: bunx eslint src --max-warnings 50 2>&1 | tee /tmp/step-3-lint.log

      - name: Test
        run: bunx vitest run 2>&1 | tee /tmp/step-4-test.log
